services:
  - type: web
    name: elo
    runtime: node
    plan: free
    buildCommand: npm --prefix server install && npm --prefix web install --include=dev && npm --prefix web run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: "*"
      # cole a connection string do MongoDB Atlas no painel do Render (Environment)
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: elo
      # chave de acesso: sem ela, quem abrir a URL nao ve nada.
      # defina no painel do Render um valor so seu (ex: uma frase aleatoria).
      - key: GATE_KEY
        sync: false
