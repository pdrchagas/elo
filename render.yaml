services:
  - type: web
    name: elo
    runtime: node
    plan: free
    buildCommand: npm install && npm run install:all && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: "*"
      # cole a connection string do MongoDB Atlas no painel do Render (Environment)
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: elo
